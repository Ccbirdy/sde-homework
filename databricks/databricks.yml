bundle:
  name: supplier_performance

experimental:
  skip_name_prefix_for_schema: true

include:
  - resources/schema.yml
  - resources/volume.yml
  - resources/supplier_performance.job.yml

variables:
  catalog:
    default: workspace
  schema_name:
    description: Schema für das jeweilige Deployment-Ziel.

targets:
  dev:
    default: true
    presets:
      name_prefix: "dev_"
      trigger_pause_status: PAUSED
      tags:
        dev: "dev"
    variables:
      schema_name: supplier_performance_dev

  prod:
    mode: production
    presets:
      name_prefix: "prod_"
    variables:
      schema_name: supplier_performance_prod
    workspace:
      root_path: /Workspace/Users/guochengcheng93@gmail.com/.bundle/${bundle.name}/${bundle.target}
