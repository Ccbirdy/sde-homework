bundle:
  name: supplier_performance
  engine: direct

experimental:
  skip_name_prefix_for_schema: true

include:
  - resources/schema.yml
  - resources/volume.yml
  - resources/supplier_performance.job.yml
  - resources/supplier_performance_review.job.yml

variables:
  cost_center:
    description: Project cost centre.
    default: supplier_analytics
  catalog:
    description: Existing project catalog initialised by the separate SQL bootstrap job.
  source_path:
    description: Workspace folder containing the seven original source CSV files.
    default: /Workspace/Users/guochengcheng93@gmail.com/landing_zone_case_solution
  branch_groups_json:
    description: JSON mapping of branch codes to existing account groups. Empty denies branch access.
    default: '{}'
  central_group:
    description: Optional existing account group allowed to read all Gold results.
    default: ''

# No broad catalog or schema SELECT grants. Access is published by the Gold task.
targets:
  dev:
    default: true
    presets:
      name_prefix: "dev_"
      trigger_pause_status: PAUSED
      tags:
        dev: "dev"
    variables:
      catalog: supplier_performance_dev
  prod:
    mode: production
    presets:
      name_prefix: "prod_"
      trigger_pause_status: PAUSED
    variables:
      catalog: supplier_performance_prod
    workspace:
      root_path: /Workspace/Users/guochengcheng93@gmail.com/.bundle/${bundle.name}/${bundle.target}
