resources:
  jobs:
    supplier_performance:
      name: supplier_performance
      max_concurrent_runs: 1
      # Optional: täglich um 06:00 Uhr in Berlin. Derzeit nicht aktiviert.
      # schedule:
      #   quartz_cron_expression: '0 0 6 * * ?'
      #   timezone_id: Europe/Berlin
      #   pause_status: PAUSED
      # Monatliche Alternative: '0 0 6 1 * ?' (am 1. des Monats).
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema_name
          default: ${resources.schemas.project_schema.name}
        - name: source_path
          default: ${resources.volumes.source_files.volume_path}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/01_bronze.py
            source: WORKSPACE
