resources:
  jobs:
    supplier_performance:
      name: supplier_performance
      max_concurrent_runs: 1
      # Täglich um 06:00 Uhr in Berlin. Der Zeitplan ist pausiert.
      schedule:
        quartz_cron_expression: '0 0 6 * * ?'
        timezone_id: Europe/Berlin
        pause_status: PAUSED
      # Monatliche Alternative: '0 0 6 1 * ?' (am 1. des Monats).
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema_name
          default: ${resources.schemas.project_schema.name}
        - name: source_path
          default: ${resources.volumes.source_files.volume_path}
        # Annahme für die Demo, kein bestätigter Extraktstichtag.
        - name: as_of_date
          default: '2026-09-30'
        - name: min_items
          default: '1'
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/01_bronze.py
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/02_silver.py
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/03_gold.py
            source: WORKSPACE
