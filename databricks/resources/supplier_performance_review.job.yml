resources:
  jobs:
    supplier_performance_review:
      name: supplier_performance_review
      max_concurrent_runs: 1
      tags:
        project: supplier_performance
        environment: ${bundle.target}
        cost_center: ${var.cost_center}
        purpose: result_review
      # This administrative review job runs as its owner. Do not grant employees job-run access.
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: table_prefix
          default: ${bundle.target}_
        - name: gold_schema
          default: ${resources.schemas.gold_schema.name}
        - name: report_month
          default: '2026-09-01'
        - name: branch
          default: 'ALL'
        - name: po_number
          default: ''
        - name: po_item
          default: ''
      tasks:
        - task_key: review_results
          notebook_task:
            notebook_path: ../src/05_result_queries.sql
            source: WORKSPACE
