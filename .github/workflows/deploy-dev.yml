name: Deploy Databricks
run-name: Deploy ${{ inputs.target }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment-Ziel
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: databricks-supplier-performance-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: '1.20.0'

      - name: Deploy bundle
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_TARGET: ${{ inputs.target }}
        run: databricks bundle deploy -t "$BUNDLE_TARGET"
