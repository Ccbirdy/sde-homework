name: Deploy Databricks
run-name: Deploy ${{ inputs.target }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: databricks-supplier-performance-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: '1.20.0'

      - name: Deploy bundle
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_TARGET: ${{ inputs.target }}
        run: |
          databricks bundle validate -t "$BUNDLE_TARGET"
          databricks bundle deploy -t "$BUNDLE_TARGET"

      - name: Upload verified demo source files
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_TARGET: ${{ inputs.target }}
        run: |
          python scripts/verify_source_files.py
          for source in data/source/*.csv; do
            databricks fs cp "$source" "dbfs:/Volumes/supplier_performance_${BUNDLE_TARGET}/${BUNDLE_TARGET}_landing/${BUNDLE_TARGET}_source_files/$(basename "$source")" --overwrite
          done
