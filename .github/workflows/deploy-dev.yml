name: Deploy Databricks
run-name: Deploy ${{ inputs.target }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      unbind_unused_dev_landing:
        description: One-time dev migration - unbind unused Landing resources before deployment
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: databricks-supplier-performance-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: '1.20.0'

      - name: Unbind unused dev Landing resources
        if: ${{ inputs.unbind_unused_dev_landing }}
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_TARGET: ${{ inputs.target }}
        run: |
          if [ "$BUNDLE_TARGET" != "dev" ]; then
            echo "The Landing migration is limited to dev. No resources were changed."
            exit 1
          fi
          python scripts/unbind_unused_dev_landing.py

      - name: Deploy bundle
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_TARGET: ${{ inputs.target }}
        run: |
          # Run the separate SQL bootstrap job before the first main deployment.
          if ! databricks catalogs get "supplier_performance_${BUNDLE_TARGET}" >/dev/null; then
            echo "Catalog unavailable. Deploy Databricks bootstrap, run the initialization job successfully, then retry. Check access if the catalog already exists."
            exit 1
          fi
          databricks bundle validate -t "$BUNDLE_TARGET"
          databricks bundle deploy -t "$BUNDLE_TARGET"
