name: Run Databricks review
run-name: Review ${{ inputs.target }} / ${{ inputs.report_month }} / ${{ inputs.branch_code }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Databricks-Ziel
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      report_month:
        description: Berichtsmonat (yyyy-MM-01)
        type: string
        required: true
        default: '2026-09-01'
      branch_code:
        description: Niederlassung (WERKS-Code oder ALL, kein Git-Branch)
        type: string
        required: true
        default: ALL
      po_number:
        description: Optionaler Filter auf Bestellnummer
        type: string
        required: false
        default: ''
      po_item:
        description: Optionale Bestellposition mit führenden Nullen
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Gleiche Gruppe wie beim Deployment: kein gleichzeitiges Deploy und Review über diese Actions.
concurrency:
  group: databricks-supplier-performance-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: '1.20.0'

      - name: Run review job
        working-directory: databricks
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AUTH_TYPE: pat
          BUNDLE_TARGET: ${{ inputs.target }}
          REPORT_MONTH: ${{ inputs.report_month }}
          BRANCH_CODE: ${{ inputs.branch_code }}
          PO_NUMBER: ${{ inputs.po_number }}
          PO_ITEM: ${{ inputs.po_item }}
        # Startet den bereits bereitgestellten Job und wartet auf dessen Ergebnis.
        # Der ausgewählte Git-Branch liefert die Bundle-Konfiguration, keinen neuen Deployment-Stand.
        run: |
          databricks bundle run -t "$BUNDLE_TARGET" supplier_performance_review -- \
            --report_month="$REPORT_MONTH" \
            --branch="$BRANCH_CODE" \
            --po_number="$PO_NUMBER" \
            --po_item="$PO_ITEM"
